[project]
name = "relay-jobs"
version = "0.1.0"
description = "Local-first durable background job system with inspectable attempts, leases and recovery."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "platformdirs>=4,<5",
]

[project.scripts]
relay = "relay.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
