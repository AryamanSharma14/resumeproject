name: Relay release rehearsal
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build only by default. Upload requires protected environment approval.'
        required: true
        default: build-only
        type: choice
        options: [build-only, testpypi, pypi]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay
    steps:
      # SHAs verified against upstream tag refs; see docs/devlog/release-gates.md.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.4.1'
      - run: python -m pip install uv==0.11.7
      - run: uv sync --locked --group docs
      - run: npm ci
        working-directory: relay/web
      - run: npm test
        working-directory: relay/web
      - run: npm run build
        working-directory: relay/web
      - run: uv run --locked pytest -ra
      - run: uv run --locked python scripts/build_release.py --output dist
      - name: Compare repeat build
        run: |
          uv run --locked python scripts/build_release.py --output dist-repeat
          diff dist/SHA256SUMS dist-repeat/SHA256SUMS
      - name: Isolated wheel smoke
        run: uv run --locked python tests/test_release_wheel.py --wheel dist/relay_jobs-*.whl
      - run: uv run --locked --group docs mkdocs build --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-release-bundle
          path: relay/dist/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-docs-preview
          path: relay/site/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: bundle
    # Repository owner must configure these attestations AND required reviewers
    # on both named environments. No public upload while the repository is private.
    if: >-
      inputs.target != 'build-only' &&
      vars.RELAY_RELEASE_GATES_APPROVED == 'true' &&
      (inputs.target == 'testpypi' ||
       (vars.RELAY_PUBLIC_RELEASE_APPROVED == 'true' &&
        vars.RELAY_TESTPYPI_REHEARSAL_PASSED == 'true' &&
        github.event.repository.private == false))
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.target == 'pypi' && 'pypi' || 'testpypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: relay-release-bundle
          path: bundle
      - name: Verify checksums and wheel version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd bundle
          sha256sum --check SHA256SUMS
          python - <<'PY'
          import os, pathlib, zipfile, email
          wheels = list(pathlib.Path('.').glob('*.whl'))
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as wheel:
              name = next(n for n in wheel.namelist() if n.endswith('.dist-info/METADATA'))
              metadata = email.message_from_bytes(wheel.read(name))
              assert metadata['Version'] == os.environ['REF_NAME'][1:]
          PY
          mkdir ../publish
          cp *.whl ../publish/
      - name: Trusted publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
        with:
          packages-dir: publish/
          repository-url: https://test.pypi.org/legacy/
      - name: Trusted publish to PyPI after approval
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
        with:
          packages-dir: publish/
# No automatic tag trigger, GitHub Release, GHCR push, or Pages deployment.
# Signing, image provenance and clean-VM rehearsal remain explicit release gates.
